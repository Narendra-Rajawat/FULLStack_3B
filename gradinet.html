<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 10px;
            padding: 0;
            /* box-sizing: border-box; */
        }
        body{
            background-color: black;
        }
        .box{
            width: 200px;
            height: 200px;
            background: conic-gradient( from 180deg, purple, rgb(168, 99, 253));
        }
        #box1 {
    width: 300px;
    height: 300px;

    border: 4px solid transparent;
    border-radius: 20px;

    background:
        linear-gradient(black, black) padding-box,
        linear-gradient(0deg, rgb(235, 108, 108), rgb(230, 254, 141), rgb(255, 169, 103)) border-box;
}
#box1 h3 {
    color: white;
    text-align: center;
    margin-top: 100px;
    font-size: 70px;
     background: linear-gradient(0deg, rgb(235, 108, 108), rgb(230, 254, 141), rgb(255, 169, 103));
    background-clip: text; 
    color: transparent;   
}
    </style>
</head>
<body>
    <div class="box" id="box1"><h3>BOX 1</h3></div>
    <div class="box" id="box2"><h4>BOX 2</h4></div>
</body>
</html>
