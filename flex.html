<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            outline:1px solid black;
        }
        .container >div{
            font-size: 30px;
            outline:1px solid blue;
        }
        


    </style>

    
</head>
<body>
    <div class="container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
    </div>
</body>
</html>
