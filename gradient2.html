```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Hero</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080014;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero {
            position: relative;
            width: 90%;
            max-width: 1000px;
            min-height: 550px;
            border-radius: 30px;
            overflow: hidden;

            /* Main gradient */
            background: linear-gradient(
                135deg,
                #16002b,
                #5b087d,
                #ff0080
            );

            box-shadow:
                0 0 40px rgba(255, 0, 128, 0.35);
        }

        /* Glow 1 */
        .hero::before {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            background: linear-gradient(
                135deg,
                #00f2ff,
                #0066ff
            );

            border-radius: 50%;

            top: -150px;
            right: -100px;

            filter: blur(20px);
            opacity: 0.8;
        }

        /* Glow 2 */
        .hero::after {
            content: "";
            position: absolute;

            width: 350px;
            height: 350px;

            background: linear-gradient(
                135deg,
                #ff0080,
                #ff8a00
            );

            border-radius: 50%;

            bottom: -180px;
            left: -100px;

            filter: blur(30px);
            opacity: 0.8;
        }

        .content {
            position: relative;
            z-index: 2;

            padding: 100px 70px;
            color: white;
        }

        .content h1 {
            font-size: 60px;
            margin-bottom: 20px;

            background: linear-gradient(
                to right,
                white,
                #b9faff
            );

            -webkit-background-clip: text;
            color: transparent;
        }

        .content p {
            font-size: 20px;
            max-width: 550px;
            line-height: 1.6;
            color: #eeeeee;
        }

        .btn {
            display: inline-block;

            margin-top: 35px;
            padding: 14px 30px;

            border-radius: 50px;

            background: linear-gradient(
                90deg,
                #00eaff,
                #0077ff
            );

            color: white;
            text-decoration: none;

            box-shadow:
                0 0 25px rgba(0, 234, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="content">
            <h1>Build Something Amazing.</h1>

            <p>
                Learn HTML, CSS and JavaScript by creating
                beautiful interfaces instead of just watching tutorials.
            </p>

            <a href="#" class="btn">Start Learning →</a>
        </div>

    </div>

</body>
</html>
```
