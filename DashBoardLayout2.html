<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
      .parent{
        gap: 10px;
        width:100%;
        height:100vh;
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        /* grid-template-rows: repeat(3, 1fr); */
      }
      .box{
        width:100px;
        height:100px;
        background-color:blue;
        margin: 5px;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        text-align:center;
      }
      #b1{
        width: 100%;
        grid-column: 1/ 4;
        grid-row: 1/3;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgb(0, 0, 0);
        border-radius: 5px;
      }
      #b2{
        height: 100%;
        width: 100%;
        grid-column: 1/ 1;
        grid-row: 2/ 5;
      }
      #b3{
        width: 100%;
        height: 100%;
        grid-column: 2/ 4;
        grid-row: 2/ 4;
      }
      #b4{
        width: 100%;
        height: 100%;
        grid-column: 2/ 3;
        grid-row: 4/ 5;
      }
      #b5{
        width: 100%;
        height: 100%;
        grid-column: 3/ 4;
        grid-row: 4/ 5;
      }
      #b6 {
    width: 100%;
    grid-column: 1 / 4;  /* poori 3 columns */
    grid-row: 5 / 6;     /* b4,b5 ke neeche */
}
    </style>
</head>
<body>
    <div class="parent">
        <div class="box" id="b1">Header</div>
        <div class="box" id="b2">2</div>
        <div class="box" id="b3">3</div>
        <div class="box" id="b4">4</div>
        <div class="box" id="b5">5</div>
        <div class="box" id="b6">6</div>
    </div>
</body>
</html>
